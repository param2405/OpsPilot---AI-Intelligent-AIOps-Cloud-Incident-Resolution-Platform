[project]
name = "opspilot-ai"
version = "0.1.0"
description = "OpsPilot AI backend — Phase 1 foundation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.25",
  "psycopg[binary]>=3.1.18",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
